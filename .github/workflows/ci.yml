name: Backend CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: vee_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vee_test -d vee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BACKEND_URL: http://localhost:8084
      FRONTEND_URL: http://localhost:3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vee_test
      POSTGRES_USER: vee_test
      POSTGRES_PWD: test_password
      TEST_DATABASE_URL: postgresql://vee_test:test_password@localhost:5432/vee_test
      SECRET_JWT_KEY: ci-only-secret-key-with-at-least-32-characters
      CHECKOUT_HMAC_KEY: ci-only-checkout-key-with-at-least-32-chars
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-at-least-32-chars
      ENVIRONMENT: test
      DATABASE_SSLMODE: disable
      ALGORITHM: HS256
      MAIL_USER: ci
      MAIL_PASS: ci
      MAIL_HOST: localhost
      MAIL_PORT: "587"
      MAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.9
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Security scans
        run: |
          uv run pip-audit --strict
          uv run bandit -q -lll -r app
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q

