<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background-color: #2e6cbb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
        }
        .code-box {
            background-color: #f4f4f4;
            padding: 15px;
            border: 1px dashed #2e6cbb;
            font-size: 24px;
            letter-spacing: 5px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div style="font-family: sans-serif; max-width: 600px; margin: auto;">
        <h2>Password Reset Request</h2>
        <p>Hello {{ name }},</p>
        <p>We received a request to reset your password.</p>

        <p>Click the button below to go directly to the reset page:</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ reset_url }}" class="button" style="color: white;">Reset My Password</a>
        </div>

        <p>This link will expire in <strong>30 minutes</strong>. If you did not request this, please ignore this email.</p>
        <hr>
        <p style="font-size: 12px; color: #888;">Vee Support Team</p>
    </div>
</body>
</html>
